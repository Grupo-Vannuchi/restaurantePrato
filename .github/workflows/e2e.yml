name: E2E

on:
  pull_request:
  push:
    branches: [Development, main]

# Cancel superseded runs on the same ref.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright
    runs-on: ubuntu-latest

    # Playwright builds + starts the app, which prerenders pages via Prisma, so
    # the E2E job needs its own database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: agency
          POSTGRES_DB: agency
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://agency:agency@localhost:5432/agency
      DIRECT_URL: postgresql://agency:agency@localhost:5432/agency
      SESSION_SECRET: ci-session-secret-not-real-change-me-please
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npx prisma migrate deploy

      # playwright.config builds + starts the app as the web server (CI only)
      # before running the specs — no globalSetup/seeding needed.
      - name: Run E2E tests
        run: npm run test:e2e

      # A varredura mede o COMPOSTO renderizado — esconde o texto, fotografa e
      # amostra a cor sob cada elemento — em três larguras e nas sete rotas. As
      # guardas de `e2e/` cobrem superfícies que alguém já sabia que existiam;
      # esta acha o que ninguém pensou em olhar, e por isso vale de porta.
      #
      # Reaproveita o `.next` que o `webServer` do passo anterior construiu:
      # `npm run build && npm run start` roda em CI, então aqui basta subir. Um
      # segundo build custaria dois minutos para produzir o mesmo artefato.
      #
      # ⚠️ Roda mesmo se o passo de E2E falhar (`always()`): as duas medições são
      # independentes, e saber que o contraste regrediu junto com outra coisa é
      # mais útil que descobrir isso na rodada seguinte.
      - name: Varredura de contraste
        if: ${{ always() }}
        env:
          BASE_URL: http://localhost:3000
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/ || { echo "o servidor não subiu"; exit 1; }
          npm run varre:contraste

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
